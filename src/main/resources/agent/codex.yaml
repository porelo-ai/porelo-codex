name: codex
label: Codex CLI
binary: codex

config_dir: "~/.codex"

# What this adapter can hold a task to: a count at the same time, which 0 switches off by a hook.
# CodexContainerSetup turns the task's number into both. There is no depth: agents.max_depth does not hold.
subagents: count
login:
    arguments: ["-c", 'cli_auth_credentials_store="file"', "login", "--device-auth"]
    # --device-auth takes OpenAI's device page and a one-time code, not a callback on localhost.
    flow: device-code
    documentation: "https://learn.chatgpt.com/docs/auth"

provider:
    default: chatgpt
    dialect: openai
    endpoint: url

refused_domains:
    - ab.chatgpt.com

sandboxed:
    arguments: ["--dangerously-bypass-approvals-and-sandbox", "--no-daemon"]

git_identity:
    name: Codex
    email: codex@users.noreply.github.com

headless:
    prompt_flag: ""
    model_flag: "--model"
    output_format_flags: ["--json"]

session:
    supports_resume: true
    resume_flag: resume
    # How an attended session takes its opening text: last and positional. 'codex --help': "Usage: codex
    # [OPTIONS] [PROMPT]", the interactive CLI when no subcommand is given. Measured on 0.163.0 in an attended
    # task: it answers the text as its first turn, then rests at its prompt.
    opening_flag: ""
    ready_marker: "? for shortcuts"
    # The composer remains visible during work, so its footer alone cannot permit wake input.
    at_rest:
        shows: ["› ", "? for shortcuts"]
        lacks: ["esc to interrupt", "enter continue · esc quit", "enter select · esc back"]
    waiting:
        last_message:
            record: {type: item.completed, item.type: agent_message}
            text: item.text
        screen:
            - contains: "enter continue · esc quit"
              in_last_lines: 5
              for: "workspace trust"
            - contains: "enter select · esc back"
              in_last_lines: 5
              for: "a selection"
    session_id:
        record: {type: thread.started}
        key: thread_id
        directory: .codex/sessions
        suffix: .jsonl
        file_record: {type: session_meta}
        file_key: payload.id

install:
    version: "${agent.cli.version}"
    # Root's, outside the home: fetched and unpacked in the root part of the image, so what the agent in
    # a task writes never picks what the next start runs, and a self-update fails to write over it.
    artifacts:
        - url: https://github.com/openai/codex/releases/download/rust-v${agent.cli.version}/codex-x86_64-unknown-linux-musl.tar.gz
          sha256: "${agent.cli.sha256}"
          license: Apache-2.0
          target: /var/cache/porelo/codex/cli.tar.gz
          mode: "0644"
          owner: root
        - url: https://github.com/openai/codex/releases/download/rust-v${agent.cli.version}/codex-code-mode-host-x86_64-unknown-linux-musl.tar.gz
          sha256: "${agent.helper.sha256}"
          license: Apache-2.0
          target: /var/cache/porelo/codex/helper.tar.gz
          mode: "0644"
          owner: root
    as_root:
        - >-
          RUN set -eux;
          staging=$(mktemp -d);
          trap 'rm -rf "$staging"' EXIT;
          test "$(tar -tzf /var/cache/porelo/codex/cli.tar.gz)" = codex-x86_64-unknown-linux-musl;
          test "$(tar -tzf /var/cache/porelo/codex/helper.tar.gz)" = codex-code-mode-host-x86_64-unknown-linux-musl;
          tar -xzf /var/cache/porelo/codex/cli.tar.gz -C "$staging" --no-same-owner;
          tar -xzf /var/cache/porelo/codex/helper.tar.gz -C "$staging" --no-same-owner;
          install -D -o root -g root -m 0755 "$staging/codex-x86_64-unknown-linux-musl" /usr/local/bin/codex;
          install -D -o root -g root -m 0755 "$staging/codex-code-mode-host-x86_64-unknown-linux-musl" /usr/local/bin/codex-code-mode-host;
          rm -r /var/cache/porelo/codex
    as_agent:
        - ENV CODEX_HOME=/home/agent/.codex
        - >-
          RUN set -eux;
          mkdir -p /home/agent/.codex;
          chmod 0700 /home/agent/.codex
