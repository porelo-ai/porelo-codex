# A workflow-only pull request uses the light Workflow check, so action moves build nothing.
name: Build
on:
    push:
        branches: ['**']
        paths-ignore: ['**/*.md', 'mkdocs.yml', 'doc/**', 'issues/**', '.github/**']
    pull_request:
        paths-ignore: ['**/*.md', 'mkdocs.yml', 'doc/**', 'issues/**', '.github/**']
    workflow_dispatch:

env:
    MAVEN_ARGS: -U
permissions:
    contents: read
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build and provider-independent checks
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0
            - name: The pinned GraalVM
              uses: ./.github/actions/pinned-jdk
            - name: Unit tests and document guards
              run: ./mvnw -U -B -s settings.xml verify
            - name: Resolve the shared tooling
              run: ./mvnw -U -B -q -Pci-tools -s settings.xml dependency:build-classpath -Dmdep.outputFile=target/cp.txt
            # A direct push to main never meets the pull request's check, so the push's own range is read here, by the
            # rule this commit carries. A tag checks the commit it names. A new branch or a branch pushed over has no start
            # this checkout holds, so its range starts at main; main itself cannot be pushed over.
            - name: The pushed commits' messages
              if: github.event_name == 'push'
              env:
                  PUSH_BEFORE: ${{ github.event.before }}
              run: |
                  set -eu
                  case "$PUSH_BEFORE" in
                      '') echo "::error::the push names no commit it started from"; exit 1 ;;
                  esac
                  start=$PUSH_BEFORE
                  if [ "$GITHUB_REF_TYPE" = tag ]; then
                      start="$GITHUB_SHA~1"
                  elif ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                      if [ "$GITHUB_REF" = refs/heads/main ]; then
                          echo "::error::main moved from $PUSH_BEFORE, a commit this checkout does not hold"
                          exit 1
                      fi
                      start=origin/main
                  fi
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main \
                      check-commits "$start..$GITHUB_SHA"
            - name: Shared rules, citations, documentation and workflow pins
              run: |
                  set -eu
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-shared AGENTS.md .editorconfig
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-citations .
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-readmes .
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-doc-site doc mkdocs.yml
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-actions
            - name: Both publisher digests agree with the pin
              run: |
                  set -eu
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-pin --pin codex --definition target/classes/agent/codex.yaml
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-pin --pin helper --definition target/classes/agent/codex.yaml
            - name: Native binary, protocol and packages
              run: |
                  ./mvnw -U -B -s settings.xml -Pnative,dist verify -Dagent.snapshot.run=${{ github.run_number }}
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: packages
                  path: |
                      target/*.deb
                      target/*.rpm
                      target/*.cdx.json
                  if-no-files-found: error

            # Only a push to main publishes, to the snapshot channel; a run that publishes nothing says so rather than
            # skipping silently.
            - name: Not publishing
              if: "!(github.event_name == 'push' && github.ref == 'refs/heads/main')"
              env:
                  EVENT: ${{ github.event_name }}
                  REF: ${{ github.ref }}
              run: |
                  echo "Not publishing. This run is '$EVENT' on '$REF',"
                  echo "and only a push to main publishes. The packages were built and tested here"
                  echo "and are attached to this run as artifacts; nothing reached Artifactory, so"
                  echo "'apt' will still offer whatever was published last."

            - name: Only a snapshot is published
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              run: |
                  set -eu
                  VERSION="$(sed -n 's|^    <version>\(.*\)</version>$|\1|p' pom.xml | head -1)"
                  [ -n "$VERSION" ] || { echo "::error::no version in pom.xml"; exit 1; }
                  case "$VERSION" in
                      *-SNAPSHOT) echo "  $VERSION -> snapshots" ;;
                      *) echo "::error::$VERSION on main would publish a release as a snapshot"; exit 1 ;;
                  esac

            - name: Publish the packages
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              env:
                  JF_URL: ${{ vars.JF_URL }}
                  JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
              run: |
                  set -eux
                  [ -n "${JF_URL:-}" ] || { echo "::error::JF_URL is empty"; exit 1; }
                  . .github/scripts/artifactory.sh
                  art_login
                  for p in target/*.deb; do
                      art_put "$p" "porelo-dist-deb/pool/main/p/porelo-agent-codex/" \
                          "deb.distribution=snapshots;deb.component=main;deb.architecture=amd64"
                  done
                  for p in target/*.rpm; do art_put "$p" "porelo-dist-rpm/snapshots/"; done

                  # The bill beside the package, readable without installing.
                  art_put "target/porelo-agent-codex.cdx.json" "porelo-dist-deb/pool/main/p/porelo-agent-codex/"
                  art_put "target/porelo-agent-codex.cdx.json" "porelo-dist-rpm/snapshots/"

            # Uploaded is not installable: indexing is asynchronous, and silent when it fails.
            - name: The package is indexed, not merely stored
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              env:
                  JF_URL: ${{ vars.JF_URL }}
              run: |
                  set -eu
                  [ -n "${JF_URL:-}" ] || { echo "::error::JF_URL is empty"; exit 1; }
                  DEB="$(basename target/*.deb)"
                  PACKAGES="${JF_URL}/artifactory/porelo-dist-deb/dists/snapshots/main/binary-amd64/Packages"
                  tries=0
                  status=0
                  while [ "$tries" -lt 20 ]; do
                      status=0
                      curl -sSfL -o target/snapshot-index "$PACKAGES" || status=$?
                      if [ "$status" = 0 ] && grep -qF "Filename: pool/main/p/porelo-agent-codex/$DEB" target/snapshot-index; then
                          echo "  OK    the Debian index lists $DEB"
                          exit 0
                      fi
                      tries=$((tries + 1))
                      sleep 6
                  done
                  if [ "$status" != 0 ]; then
                      echo "::error::$PACKAGES could not be read: curl exited $status"
                  else
                      echo "::error::$PACKAGES does not list $DEB after $tries reads"
                  fi
                  exit 1
